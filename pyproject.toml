[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-bigdata-pipeline"
version = "1.0.0"
description = "Pipeline de Big Data para monitoramento de vendas, comportamento de clientes e logística de e-commerce"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "E-commerce Big Data Team" }
]
dependencies = [
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "pyspark==3.5.6",
    "apache-flink==1.20.3",
    "happybase>=1.2,<2.0",
    "thrift>=0.20,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.8,<1.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]