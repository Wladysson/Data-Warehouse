agent.sources = event_source
agent.channels = hdfs_channel flink_channel
agent.sinks = hdfs_sink flink_sink

agent.sources.event_source.type = exec
agent.sources.event_source.command = tail -F data/raw/events.jsonl
agent.sources.event_source.shell = /bin/bash -c

agent.sources.event_source.channels = hdfs_channel flink_channel

agent.sources.event_source.selector.type = replicating

agent.sources.event_source.interceptors = timestamp_interceptor

agent.sources.event_source.interceptors.timestamp_interceptor.type = timestamp

agent.channels.hdfs_channel.type = file

agent.channels.hdfs_channel.checkpointDir = /opt/flume/checkpoint/hdfs
agent.channels.hdfs_channel.dataDirs = /opt/flume/data/hdfs

agent.channels.hdfs_channel.capacity = 10000
agent.channels.hdfs_channel.transactionCapacity = 1000

agent.channels.hdfs_channel.checkpointInterval = 30000

agent.channels.flink_channel.type = file

agent.channels.flink_channel.checkpointDir = /opt/flume/checkpoint/flink
agent.channels.flink_channel.dataDirs = /opt/flume/data/flink

agent.channels.flink_channel.capacity = 10000
agent.channels.flink_channel.transactionCapacity = 1000

agent.channels.flink_channel.checkpointInterval = 30000

agent.sinks.hdfs_sink.type = hdfs

agent.sinks.hdfs_sink.hdfs.path = hdfs://namenode:9000/data/raw/events/%Y/%m/%d/%H

agent.sinks.hdfs_sink.hdfs.filePrefix = events
agent.sinks.hdfs_sink.hdfs.fileSuffix = .json

agent.sinks.hdfs_sink.hdfs.fileType = DataStream
agent.sinks.hdfs_sink.hdfs.writeFormat = Text

agent.sinks.hdfs_sink.hdfs.rollInterval = 60
agent.sinks.hdfs_sink.hdfs.rollSize = 134217728
agent.sinks.hdfs_sink.hdfs.rollCount = 0

agent.sinks.hdfs_sink.hdfs.batchSize = 1000

agent.sinks.hdfs_sink.hdfs.idleTimeout = 120

agent.sinks.hdfs_sink.hdfs.useLocalTimeStamp = false

agent.sinks.hdfs_sink.hdfs.round = true
agent.sinks.hdfs_sink.hdfs.roundValue = 1
agent.sinks.hdfs_sink.hdfs.roundUnit = hour

agent.sinks.hdfs_sink.hdfs.fileHeader = false
agent.sinks.hdfs_sink.hdfs.fileHeaderKey = false

agent.sinks.hdfs_sink.channel = hdfs_channel

agent.sinks.flink_sink.type = netcat

agent.sinks.flink_sink.hostname = flink
agent.sinks.flink_sink.port = 9999

agent.sinks.flink_sink.connect-timeout = 10000
agent.sinks.flink_sink.request-timeout = 10000

agent.sinks.flink_sink.channel = flink_channel